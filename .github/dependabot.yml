version: 2
updates:
  - package-ecosystem: bundler
    directories:
      - "/"
      - "/server"
      - "/client"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    ignore:
      - dependency-name: "json"
        update-types: ["version-update:semver-major"]
    groups:
      ruby-production:
        dependency-type: production
        update-types: [minor, patch]
      ruby-development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: npm
    directories:
      - "/server"
      - "/web"
      - "/node"
      - "/docs"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      npm-production:
        dependency-type: production
        update-types: [minor, patch]
      npm-development:
        dependency-type: development
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: "/python"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      python:
        patterns: ["*"]

  - package-ecosystem: gomod
    directory: "/go"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: "/server"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      images:
        patterns: ["*"]

  - package-ecosystem: docker-compose
    directories:
      - "/"
      - "/test/conformance"
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      compose-images:
        patterns: ["*"]
