name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: Publish a package without cutting a release
        required: true
        type: choice
        options: [gem, client, image]

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      gem: ${{ steps.release.outputs['client--release_created'] }}
      gem_tag: ${{ steps.release.outputs['client--tag_name'] }}
      client: ${{ steps.release.outputs['web--release_created'] }}
      client_tag: ${{ steps.release.outputs['web--tag_name'] }}
      server: ${{ steps.release.outputs['server--release_created'] }}
      server_tag: ${{ steps.release.outputs['server--tag_name'] }}
      server_version: ${{ steps.release.outputs['server--version'] }}

    steps:
      - name: Maintain the release pull requests
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  gem:
    needs: release-please
    if: >-
      !cancelled() &&
      needs.release-please.result != 'failure' &&
      (needs.release-please.outputs.gem == 'true' || inputs.package == 'gem')
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.gem_tag }}

      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: client

      - name: Test both halves of the gem
        working-directory: client
        run: bundle exec rake test

      - uses: rubygems/configure-rubygems-credentials@v2.1.0

      - name: Build
        working-directory: client
        run: gem build masks.gemspec

      - name: Push
        working-directory: client
        run: gem push masks-*.gem

  client:
    needs: release-please
    if: >-
      !cancelled() &&
      needs.release-please.result != 'failure' &&
      (needs.release-please.outputs.client == 'true' || inputs.package == 'client')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.client_tag }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.node-version
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Trusted publishing needs a newer npm than the runner ships
        run: npm install -g npm@latest

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Build, which is the typecheck that emits
        working-directory: web
        run: npm run build

      - name: Test
        working-directory: web
        run: npm test

      - name: Publish
        working-directory: web
        run: npm publish --access public

  image:
    needs: release-please
    concurrency:
      group: image-${{ github.ref }}
      cancel-in-progress: true
    if: >-
      !cancelled() &&
      needs.release-please.result != 'failure' &&
      (github.event_name == 'push' ||
       needs.release-please.outputs.server == 'true' ||
       inputs.package == 'image')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.server_tag || github.sha }}

      - uses: docker/setup-qemu-action@v3
        if: needs.release-please.outputs.server == 'true'

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Name the image after the release, or the commit that made it
        id: tags
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.release-please.outputs.server_version }},enable=${{ needs.release-please.outputs.server == 'true' }}
            type=raw,value=latest,enable=${{ needs.release-please.outputs.server == 'true' }}
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,format=long

      # arm64 is emulated, and emulating a bundle install and an asset build
      # costs about ten times what running them natively does. A release is
      # worth waiting for; a commit on main is not.
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: server
          build-contexts: web=web
          platforms: ${{ needs.release-please.outputs.server == 'true' && 'linux/amd64,linux/arm64' || 'linux/amd64' }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: ${{ steps.tags.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Provenance is a public-repository feature on this plan, so it waits
      # for the repository to be one rather than failing the release.
      - name: Attest what built it
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
