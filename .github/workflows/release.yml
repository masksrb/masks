name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      package:
        description: Publish a package without cutting a release
        required: true
        type: choice
        options: [gem, client]

permissions: {}

jobs:
  release-please:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      gem: ${{ steps.release.outputs['client--release_created'] }}
      gem_tag: ${{ steps.release.outputs['client--tag_name'] }}
      client: ${{ steps.release.outputs['web--release_created'] }}
      client_tag: ${{ steps.release.outputs['web--tag_name'] }}

    steps:
      - name: Maintain the release pull requests
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  gem:
    needs: release-please
    if: >-
      !cancelled() &&
      needs.release-please.result != 'failure' &&
      (needs.release-please.outputs.gem == 'true' || inputs.package == 'gem')
    runs-on: ubuntu-latest
    environment: rubygems
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.gem_tag }}

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: client

      - name: Test the client half
        working-directory: client
        run: bundle exec rake test:client

      - name: Test the Rails half
        working-directory: client
        run: bundle exec rake test:rails

      - uses: rubygems/configure-rubygems-credentials@v1

      - name: Build
        working-directory: client
        run: gem build masks.gemspec

      - name: Push
        working-directory: client
        run: gem push masks-*.gem

      - uses: rubygems/await-rubygems-release@v1

  client:
    needs: release-please
    if: >-
      !cancelled() &&
      needs.release-please.result != 'failure' &&
      (needs.release-please.outputs.client == 'true' || inputs.package == 'client')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.release-please.outputs.client_tag }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.node-version
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Trusted publishing needs a newer npm than the runner ships
        run: npm install -g npm@latest

      - name: Install
        working-directory: web
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      - name: Test
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      - name: Publish
        working-directory: web
        run: npm publish --access public
