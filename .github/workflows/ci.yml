name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: "3.4"
      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Install shfmt, which the runner does not ship
        run: |
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.14.0/shfmt_v3.14.0_linux_amd64
          chmod +x /usr/local/bin/shfmt
      - name: The biome the repo pins, not whatever npx would fetch
        run: |
          npm ci --prefix server
          npm ci --prefix web
      - name: Every formatter and linter, the same ones dev fmt runs
        env:
          RUBOCOP_FORMAT: github
        run: ./dev fmt --check
      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

  scan:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: server
      - name: Scan for Rails security defects
        working-directory: server
        run: bin/brakeman --no-pager
      - name: Scan gems for known vulnerabilities
        working-directory: server
        run: bin/bundler-audit

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, engine, client, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: ${{ matrix.suite }}, in the container it ships in
        run: ./dev test ${{ matrix.suite }}

  boot:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: server
      - name: Create the non-superuser application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 5435 -U postgres \
            -f server/db/docker-entrypoint-initdb.d/01-app-role.sql
      - name: Eager load the way production does
        working-directory: server
        env:
          RAILS_ENV: production
          POSTGRES_DATABASE: masks_boot
          MASKS_PUBLIC_ORIGIN_TEMPLATE: https://%{subdomain}.auth.invalid
          SECRET_KEY_BASE: boot_check_secret_key_base_not_for_real_deployments
          ENCRYPTION_PRIMARY_KEY: boot_check_primary_key_not_for_credentials
          ENCRYPTION_DETERMINISTIC_KEY: boot_check_deterministic_key_not_real
          ENCRYPTION_KEY_DERIVATION_SALT: boot_check_key_derivation_salt_fake
        run: bin/rails db:prepare zeitwerk:check

  frontend:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Build @masks/client, which the manage bundle imports by path
        working-directory: web
        run: npm ci && npm run build
      - name: Check the components against their templates
        working-directory: server
        run: npm ci && npm run check:svelte
      - name: Build the login bundle
        working-directory: server
        run: npx vite build

  reference:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: server
      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - name: The generated reference pages still match their sources
        env:
          RAILS_ENV: test
        run: |
          ./dev reference
          git diff --exit-code -- docs ||
            {
              echo "::error::The reference pages are stale. Run ./dev reference and commit."
              exit 1
            }

  build:
    needs: [test, scan, boot, frontend, reference]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: client
      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: docker/setup-buildx-action@v4
      - name: The gem
        working-directory: client
        run: gem build masks.gemspec
      - name: The browser package
        working-directory: web
        run: npm ci && npm run build
      - name: The server image
        uses: docker/build-push-action@v7
        with:
          context: server
          build-contexts: web=web
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
