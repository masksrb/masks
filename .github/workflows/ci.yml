name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  boundary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: No host, domain, or secret may be named here
        run: bin/check-boundary

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
      - name: Lint every Ruby file, the gem and the harness included
        run: bundle exec rubocop -f github

  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.node-version
      - name: Install shfmt
        run: |
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.14.0/shfmt_v3.14.0_linux_amd64
          chmod +x /usr/local/bin/shfmt
      - name: YAML and Markdown
        run: |
          npx --yes prettier --check --no-error-on-unmatched-pattern \
            "*.{yml,yaml,md}" ".github/**/*.{yml,yaml}" \
            "server/config/**/*.{yml,yaml}" "conformance/**/*.{yml,yaml}"
      - name: Shell
        run: |
          scripts=()
          while IFS= read -r s; do scripts+=("$s"); done < <(shfmt -f bin server/bin)
          shfmt -d -i 2 -ci "${scripts[@]}"
          shellcheck "${scripts[@]}"

  actions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: server
      - name: Scan for Rails security defects
        working-directory: server
        run: bin/brakeman --no-pager
      - name: Scan gems for known vulnerabilities
        working-directory: server
        run: bin/bundler-audit

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: server
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: libvips, which ruby-vips loads to square an avatar
        run: |
          sudo apt-get update -qq
          sudo apt-get install --no-install-recommends -y libvips42t64 \
            || sudo apt-get install --no-install-recommends -y libvips42
      - name: Build @masks/client, which the manage bundle imports by path
        working-directory: web
        run: npm ci && npm run build
      - name: Build the assets the tests render
        working-directory: server
        env:
          RAILS_ENV: test
        run: npm ci && bin/vite build --mode=test
      - name: Create the non-superuser application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 5435 -U postgres -c \
            "CREATE ROLE masks WITH LOGIN PASSWORD 'masks' CREATEDB;"
      - name: Test
        working-directory: server
        env:
          RAILS_ENV: test
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5435
        run: bin/rails db:prepare test

  boot:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5436:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: server
      - name: Create the non-superuser application role
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 5436 -U postgres -c \
            "CREATE ROLE masks WITH LOGIN PASSWORD 'masks' CREATEDB;"
      - name: Eager load the way production does
        working-directory: server
        env:
          RAILS_ENV: production
          POSTGRES_HOST: 127.0.0.1
          POSTGRES_PORT: 5436
          POSTGRES_USER: masks
          POSTGRES_PASSWORD: masks
          POSTGRES_DATABASE: masks_boot
          MASKS_PUBLIC_ORIGIN_TEMPLATE: https://%{subdomain}.auth.invalid
          SECRET_KEY_BASE: boot_check_secret_key_base_not_for_real_deployments
          ENCRYPTION_PRIMARY_KEY: boot_check_primary_key_not_for_credentials
          ENCRYPTION_DETERMINISTIC_KEY: boot_check_deterministic_key_not_real
          ENCRYPTION_KEY_DERIVATION_SALT: boot_check_key_derivation_salt_fake
        run: bin/rails db:prepare zeitwerk:check

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: server/package-lock.json
      - name: Lint the frontend
        working-directory: server
        run: npm ci && npm run lint
      - name: Build @masks/client, which the manage bundle imports by path
        working-directory: web
        run: npm ci && npm run build
      - name: Check the components against their templates
        working-directory: server
        run: npm run check:svelte
      - name: Build the login bundle
        working-directory: server
        run: npx vite build

  gem:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
      - name: Build the gem
        working-directory: client
        run: gem build masks.gemspec

  client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
          working-directory: client
      - name: Test the client half
        working-directory: client
        run: bundle exec rake test:client
      - name: Test the Rails half
        working-directory: client
        run: bundle exec rake test:rails

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        working-directory: web
        run: npm ci
      - name: Lint
        working-directory: web
        run: npm run lint
      - name: Typecheck
        working-directory: web
        run: npm run typecheck
      - name: Build
        working-directory: web
        run: npm run build
      - name: Test
        working-directory: web
        run: npm test

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}
      - if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the server image
        uses: docker/build-push-action@v6
        with:
          context: server
          build-contexts: web=web
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
