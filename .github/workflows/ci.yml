name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          ruby-version: "3.4"
      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
            node/package-lock.json
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          cache-dependency-glob: python/uv.lock
      - name: Install shfmt, which the runner does not ship
        run: |
          curl -fsSL -o /usr/local/bin/shfmt \
            https://github.com/mvdan/sh/releases/download/v3.14.0/shfmt_v3.14.0_linux_amd64
          chmod +x /usr/local/bin/shfmt
      - name: The biome the repo pins, not whatever npx would fetch
        run: |
          npm ci --prefix server
          npm ci --prefix web
          npm ci --prefix node
      - name: Every formatter and linter, the same ones dev fmt runs
        env:
          RUBOCOP_FORMAT: github
        run: ./dev fmt --check
      - name: Lint the workflows
        uses: raven-actions/actionlint@v2

  go:
    needs: lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: go
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go/go.mod
          cache-dependency-path: go/go.sum
      - name: Vet the Go SDK
        run: go vet ./...
      - name: Test the Go SDK under the race detector
        env:
          REDIS_URL: redis://localhost:6379/0
        run: go test -race -count=1 ./...
      - name: Scan the Go SDK's modules for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./...

  node:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    defaults:
      run:
        working-directory: node
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: node/package-lock.json
      - name: Install
        run: npm ci
      - name: Build, which is the typecheck that emits
        run: npm run build
      - name: Test @masks/server on Node ${{ matrix.node }}
        run: npm test
      - name: Audit the packages @masks/server ships with
        run: npm audit --omit=dev

  python:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.3.0
        with:
          python-version: ${{ matrix.python }}
          cache-dependency-glob: python/uv.lock
      - name: Install the Python SDK from its lockfile
        run: uv sync --frozen
      - name: Check the Python SDK's types
        run: uv run --frozen mypy --strict src
      - name: Test the Python SDK on Python ${{ matrix.python }}
        run: uv run --frozen pytest -q
      - name: Scan the Python SDK's dependencies for known vulnerabilities
        run: |
          uv export --frozen --no-dev --no-emit-project --format requirements-txt > "$RUNNER_TEMP/requirements.txt"
          uvx pip-audit@2.10.1 --disable-pip --require-hashes -r "$RUNNER_TEMP/requirements.txt"
      - name: Build the Python SDK
        run: uv build

  scan:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: server
      - name: Scan for Rails security defects
        working-directory: server
        run: bin/brakeman --no-pager --add-engines-path ../engine
      - name: Scan gems for known vulnerabilities
        working-directory: server
        run: bin/bundler-audit

  test:
    needs: lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        suite: [unit, integration, provider, engine, client, web]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: crazy-max/ghaction-github-runtime@v4
      - name: ${{ matrix.suite }}, in the container it ships in
        run: ./dev test ${{ matrix.suite }}

  boot:
    needs: lint
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: server
      - name: Create the non-superuser application roles
        env:
          PGPASSWORD: postgres
        run: |
          psql -h 127.0.0.1 -p 5435 -U postgres \
            -f server/db/docker-entrypoint-initdb.d/01-app-role.sql
      - name: Migrate as the owner, and grant the serving role what it serves with
        working-directory: server
        env:
          RAILS_ENV: production
          POSTGRES_DATABASE: masks_boot
          POSTGRES_PORT: "5435"
          POSTGRES_USER: masks_owner
          POSTGRES_PASSWORD: masks_owner
          MASKS_SERVING_USER: masks
          MASKS_PUBLIC_ORIGIN_TEMPLATE: https://%{subdomain}.auth.invalid
          SECRET_KEY_BASE: boot_check_secret_key_base_not_for_real_deployments
          ENCRYPTION_PRIMARY_KEY: boot_check_primary_key_not_for_credentials
          ENCRYPTION_DETERMINISTIC_KEY: boot_check_deterministic_key_not_real
          ENCRYPTION_KEY_DERIVATION_SALT: boot_check_key_derivation_salt_fake
        run: bin/rails db:prepare masks:grants
      - name: Eager load and declare a tenant the way production does, as the serving role
        working-directory: server
        env:
          RAILS_ENV: production
          POSTGRES_DATABASE: masks_boot
          POSTGRES_PORT: "5435"
          MASKS_TENANTS: boot
          MASKS_PUBLIC_ORIGIN_TEMPLATE: https://%{subdomain}.auth.invalid
          SECRET_KEY_BASE: boot_check_secret_key_base_not_for_real_deployments
          ENCRYPTION_PRIMARY_KEY: boot_check_primary_key_not_for_credentials
          ENCRYPTION_DETERMINISTIC_KEY: boot_check_deterministic_key_not_real
          ENCRYPTION_KEY_DERIVATION_SALT: boot_check_key_derivation_salt_fake
        run: bin/rails zeitwerk:check masks:tenants

  frontend:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - name: Build @masks/client, which the manage bundle imports by path
        working-directory: web
        run: npm ci && npm run build
      - name: Check the components against their templates
        working-directory: server
        run: npm ci && npm run check:svelte
      - name: Build the login bundle
        working-directory: server
        run: npx vite build

  reference:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: server
      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: |
            docs/package-lock.json
            web/package-lock.json
      - name: The generated reference pages still match their sources
        env:
          RAILS_ENV: test
        run: |
          ./dev reference
          git diff --exit-code -- docs ||
            {
              echo "::error::The reference pages are stale. Run ./dev reference and commit."
              exit 1
            }

  build:
    needs: [test, scan, boot, frontend, reference]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true
          working-directory: client
      - uses: actions/setup-node@v7
        with:
          node-version-file: server/.node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: docker/setup-buildx-action@v4
      - name: The gem
        working-directory: client
        run: gem build masks.gemspec
      - name: The browser package
        working-directory: web
        run: npm ci && npm run build
      - name: The server image
        uses: docker/build-push-action@v7
        with:
          context: server
          build-contexts: |
            web=web
            engine=engine
          platforms: linux/amd64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
