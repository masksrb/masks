- name: Create the masks deploy directory
  ansible.builtin.file:
    path: "{{ masks_deploy_path }}"
    state: directory
    mode: "0750"

- name: Template the masks compose file
  ansible.builtin.template:
    src: compose.yml.j2
    dest: "{{ masks_deploy_path }}/compose.yml"
    mode: "0640"

- name: Pull the masks image
  ansible.builtin.command:
    cmd: docker compose pull
    chdir: "{{ masks_deploy_path }}"
  changed_when: false

- name: Start masks
  ansible.builtin.command:
    cmd: docker compose up -d
    chdir: "{{ masks_deploy_path }}"
  register: masks_up
  changed_when: "'Started' in masks_up.stderr or 'Recreated' in masks_up.stderr or 'Created' in masks_up.stderr"

- name: Wait for masks to answer its health check
  ansible.builtin.command:
    cmd: docker compose exec -T masks curl -fsS http://localhost/up
    chdir: "{{ masks_deploy_path }}"
  register: masks_health
  until: masks_health.rc == 0
  retries: 40
  delay: 3
  changed_when: false
