name: masks-test

x-secrets: &secrets
  SECRET_KEY_BASE: test_only_secret_key_base_not_for_real_deployments
  ENCRYPTION_PRIMARY_KEY: test_only_primary_key_not_for_real_credentials
  ENCRYPTION_DETERMINISTIC_KEY: test_only_deterministic_key_not_for_real_use
  ENCRYPTION_KEY_DERIVATION_SALT: test_only_key_derivation_salt_not_for_real

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - ./server/db/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      target: test
    image: masks-test-server
    command: ["bin/rails", "db:prepare", "test"]
    environment:
      <<: *secrets
      RAILS_ENV: test
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: masks
      POSTGRES_PASSWORD: masks
    depends_on:
      postgres:
        condition: service_healthy

  client:
    image: ruby:3.4
    working_dir: /masks/client
    command: ["sh", "-c", "bundle install --quiet && exec bundle exec rake test"]
    environment:
      BUNDLE_PATH: /bundle
    volumes:
      - ./client:/masks/client
      - client-bundle:/bundle

  # The engine's Gemfile takes masks-client by relative path, so both trees are
  # mounted at the depth that keeps ../client resolving.
  engine:
    image: ruby:3.4
    working_dir: /masks/engine
    command: ["sh", "-c", "bundle install --quiet && exec bundle exec rake test"]
    environment:
      BUNDLE_PATH: /bundle
    volumes:
      - ./client:/masks/client
      - ./engine:/masks/engine
      - engine-bundle:/bundle

  # The suite imports from dist/, not src/, so the build is part of the test.
  web:
    image: node:22-alpine
    working_dir: /masks/web
    command: ["sh", "-c", "npm ci --no-audit --no-fund && npm run build && exec npm test"]
    volumes:
      - ./web:/masks/web
      - web-modules:/masks/web/node_modules

volumes:
  client-bundle:
  engine-bundle:
  web-modules:
