name: masks-test

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ./server/db/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: ./server
      target: test
      additional_contexts:
        web: ./web
    command: ["bin/rails", "db:prepare", "test"]
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy

  client:
    image: ruby:3.4.7
    working_dir: /masks/client
    command:
      ["sh", "-c", "bundle install --quiet && exec bundle exec rake test"]
    environment:
      BUNDLE_PATH: /bundle
    volumes:
      - ./client:/masks/client
      - client-bundle:/bundle

  web:
    image: node:26.0.0-alpine
    working_dir: /masks/web
    command:
      [
        "sh",
        "-c",
        "npm ci --prefer-offline --no-audit --no-fund && npm run build && exec npm test",
      ]
    volumes:
      - ./web:/masks/web
      - web-modules:/masks/web/node_modules
      - web-npm-cache:/root/.npm

volumes:
  client-bundle:
  web-modules:
  web-npm-cache:
