[project]
name = "masks-client"
version = "0.3.2"
description = "Sign a Python service or machine in to masks, hold its tokens to a key with DPoP, and check masks access tokens in an API."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Jon Geiger", email = "jon@geiger.to" }]
keywords = ["oauth", "openid-connect", "dpop", "masks", "authentication"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
  "Typing :: Typed",
]
dependencies = [
  "anyio>=4.5",
  "cryptography>=44",
  "httpx>=0.28.1,<1",
  "pyjwt>=2.10",
]

[project.optional-dependencies]
django = ["django>=5.2"]
fastapi = ["fastapi>=0.115"]
flask = ["flask>=3.1"]

[project.urls]
Homepage = "https://masks.pages.dev"
Source = "https://github.com/masksrb/masks/tree/main/python"
Changelog = "https://github.com/masksrb/masks/blob/main/python/CHANGELOG.md"

[dependency-groups]
dev = [
  "django>=5.2",
  "fakeredis>=2.38.0",
  "fastapi>=0.115",
  "flask>=3.1",
  "httpx2>=2.13.1",
  "mypy>=1.18.2",
  "pytest>=9.1.1",
  "ruff>=0.16.9",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/masks"]

[tool.uv]
exclude-newer = "2026-09-28T00:00:00Z"

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]

[[tool.mypy.overrides]]
module = ["django.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101", "S105", "S106"]
