      idle:
        title: "Suppression automatique"
        help: "Un acteur avec lequel personne ne se connecte et qui n’est utilisé par aucun client est suspendu, puis supprimé, après ces durées. Chaque étape est annoncée par e-mail au moins 30 jours à l’avance, et se connecter avant une suspension conserve l’acteur. Si Suspendre est défini, seuls les acteurs suspendus pour inactivité sont supprimés. Si Suspendre est sur Jamais, les acteurs inactifs sont supprimés directement. Le dernier gestionnaire et les acteurs provisionnés par un annuaire via SCIM ne sont pas concernés."
