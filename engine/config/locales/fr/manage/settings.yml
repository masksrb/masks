      idle:
        title: "Comptes inactifs"
        help: "Un compte auquel personne ne se connecte et qui n’est utilisé par aucune application est suspendu, puis supprimé, après ces durées. Chaque étape est annoncée par e-mail au moins 30 jours à l’avance, et se connecter avant une suspension conserve le compte. Si Suspendre est défini, seuls les comptes suspendus pour inactivité sont supprimés. Si Suspendre est sur Jamais, les comptes inactifs sont supprimés directement. Le dernier gestionnaire et les comptes provisionnés par un fournisseur via SCIM ne sont pas concernés."
