fr:
  manage:
    ldap:
      title: "LDAP"
      lede: "Les services plus anciens, comme les NAS, les serveurs multimédia et les hyperviseurs, vérifient les mots de passe et lisent les groupes par LDAP. masks leur expose en lecture seule les acteurs et les groupes de ce tenant."
      revoke_confirm: "Révoquer %{label} ? Tout ce qui s'en sert est refusé dès maintenant."
      revoked: "%{label} est révoqué."
      serve:
        title: "Annuaire"
        help: "Tant que ceci est désactivé, rien ne peut se lier à l'annuaire de ce tenant ni y chercher."
        "on": "Servir ce tenant par LDAP"
        updated: "Annuaire modifié."
      connect:
        title: "Connecter un service"
        help: "Donnez au service ce DN de base, un DN de liaison et son secret. Le service cherche dans ou=people et ou=groups, puis se lie en tant qu'acteur pour vérifier son mot de passe."
        base_dn: "DN de base"
        address: "Adresse"
        port: "Port %{port}"
        ldaps: "Port %{port}, LDAPS"
        local_only: "Sans certificat, l’annuaire ne répond que sur la machine de ce serveur, pour qu’aucun mot de passe ne traverse le réseau en clair. Définissez MASKS_LDAP_CERT et MASKS_LDAP_KEY pour servir LDAPS sur toutes les adresses, ou MASKS_LDAP_PLAINTEXT=true sur un réseau privé de confiance."
        label: "Libellé"
        issue: "Émettre un identifiant"
        shown_once: "Ce secret n'est affiché qu'une fois. Copiez-le maintenant."
        bind_dn: "DN de liaison"
        secret: "Secret"
      credentials:
        title: "Identifiants"
        none: "Aucun émis."
        never: "jamais"
        used: "dernière liaison %{used}"
        revoke: "Révoquer"
      binds:
        title: "Liaisons par mot de passe"
        help: "LDAP ne peut pas demander de second facteur. Un acteur qui en a un, ou dont la politique de connexion en exige un, est refusé à moins qu'un mot de passe seul soit autorisé ici."
        password_only: "Autoriser un mot de passe seul par LDAP"
        updated: "Liaisons par mot de passe modifiées."
