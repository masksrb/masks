fr:
  manage:
    domains:
      title: "Domaines"
      help: "Revendiquez un domaine en publiant un enregistrement TXT. masks le vérifie toutes les heures. Une fois le domaine vérifié, un acteur qui y saisit une adresse peut aller directement vers un fournisseur sans mot de passe, et la connexion peut être servie depuis un hôte de ce domaine, comme login.example.com, dès que son DNS pointe ici et qu’il a un certificat. Chaque adresse est son propre émetteur, et une clé d’accès ne fonctionne que sur l’adresse où elle a été créée."
      claimed: "Publiez l’enregistrement TXT ci-dessous, puis vérifiez %{domain}."
      proven: "%{domain} est vérifié."
      unanswered: "Aucun enregistrement TXT correspondant sur %{name} pour l’instant. La propagation DNS peut prendre un moment."
      routed_away: "Les acteurs de %{domain} vont désormais vers leur fournisseur."
      routed_here: "Les acteurs de %{domain} se connectent désormais ici."
      served: "La connexion est aussi servie depuis %{host}."
      unserved: "La connexion n’est plus servie depuis un domaine personnalisé."
      stop_confirm: "Arrêter de servir %{host} ? Les clients qui l’utilisent comme émetteur cessent de fonctionner."
      release_confirm: "Libérer %{domain} ? Les acteurs qui y ont une adresse se connectent de nouveau de la façon habituelle."
      released: "%{domain} est libéré."
      here: "Se connecter ici"
      to: "Envoyer vers %{name}"
      missing: "Ne répond plus depuis %{since}"
      unproven: "Non vérifié"
      send: "Où se connectent les acteurs de %{domain}"
      check: "Vérifier"
      release: "Libérer %{domain}"
      record: "Publiez cet enregistrement TXT :"
      new: "Domaine à revendiquer"
      add: "Revendiquer"
      serve: "Servir la connexion sur"
      save: "Servir"
      stop: "Arrêter"
