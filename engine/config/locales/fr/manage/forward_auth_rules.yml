        one_factor: "Une personne connectée, sans deuxième facteur"
        two_factor: "Une personne connectée, avec son deuxième facteur"
        token: "Une personne connectée, ou un script avec un jeton d’accès"
        deny: "Fermé à tout le monde"
      rule: "Règle %{number}"
      add: "Ajouter une règle"
      remove: "Retirer"
      up: "Monter"
      down: "Descendre"
