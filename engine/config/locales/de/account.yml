        new: "Ihr neues Passwort"
        hint: "Mindestens %{minimum} Zeichen. Eine Änderung meldet Sie überall sonst ab."
        submit: "Passwort ändern"

      passkeys:
        heading: "Passkeys"
        state:
          none: "Nicht eingerichtet"
          set:
            one: "1 eingerichtet"
            other: "%{count} eingerichtet"
        explained: "Statt ein Passwort einzugeben, prüft Ihr Gerät auf dieselbe Weise, wie es sich entsperrt, dass Sie es sind. Das zählt als beide Faktoren zugleich, daher müssen Sie auf keinen Code warten."
