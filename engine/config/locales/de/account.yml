          heading: "Codes per E-Mail"
          explained: "Nach Ihrem Passwort kann eine Anmeldung mit einem Code an Ihre E-Mail-Adresse bestätigt werden. Eine Passwort-Zurücksetzung per E-Mail deaktiviert dies, weil der Link zum Zurücksetzen im selben Posteingang landet."
          unconfirmed: "Bestätigen Sie zuerst Ihre E-Mail-Adresse."
          undeliverable: "Dieser Server kann noch keine E-Mails senden."
        sms:
          heading: "Codes per SMS"
          explained: "Nach Ihrem Passwort kann eine Anmeldung mit einem per SMS an Ihr Telefon gesendeten Code bestätigt werden. Eine Authenticator-App oder ein Passkey ist schwerer zu stehlen."
          unconfirmed: "Fügen Sie zuerst eine Telefonnummer hinzu und bestätigen Sie sie."
          undeliverable: "Dieser Server kann noch keine SMS senden."

