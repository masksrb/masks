        heading: "Authenticator-App"
        state:
          "on": "Aktiv"
          "off": "Nicht eingerichtet"
        explained: "Nach Ihrem Passwort kann eine Anmeldung mit einem sechsstelligen Code aus einer App auf Ihrem Telefon bestätigt werden. Der Code ändert sich alle 30 Sekunden und funktioniert ohne Netz."
