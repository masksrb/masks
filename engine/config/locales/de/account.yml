        state:
          ready: "Bereit"
          waiting: "Wartet auf Sie"
        explained: "Diesem Gerät wird vertraut, daher kann es eine Anmeldung an anderer Stelle bestätigen. Geben Sie den Code ein, den der andere Bildschirm anzeigt. Geben Sie nur einen Code ein, den Sie selbst vor sich sehen."
        code: "Code auf dem anderen Bildschirm"
        submit: "Weiter"
        confirm: "Dieses Gerät möchte sich bei Ihrem Konto anmelden. Genehmigen Sie es nur, wenn es Ihres ist."
        asked: "angefragt vor %{age}"
        approve: "Genehmigen"
        deny: "Ablehnen"

