        heading: "Backup-Codes"
        state:
          one: "1 übrig"
          other: "%{count} übrig"
        explained: "Jeder Code meldet einmal an, wenn Ihr Telefon oder Passkey nicht zur Hand ist. Bewahren Sie sie sicher auf, getrennt von diesem Gerät."
        fresh: "Notieren Sie diese jetzt. Sie werden nicht erneut angezeigt."
        make: "Neue Codes erstellen"
        confirm_make: "Ihre aktuellen Codes funktionieren dann nicht mehr."
        make_again: "Melden Sie sich erneut an, um neue Codes zu erstellen"

      codes:
        state:
          "on": "Aktiv"
          "off": "Aus"
        sent_to: "Codes gehen an %{to}."
        turn_on: "Aktivieren"
        turn_off: "Deaktivieren"
        confirm_turn_off: "Anmeldungen nicht mehr auf diese Weise bestätigen?"
