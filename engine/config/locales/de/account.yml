        heading: "Passwort"
        state: "Ändern"
        state_none: "Nicht festgelegt"
        none: "Dieses Konto hat kein Passwort. Es meldet sich stattdessen mit einem Passkey oder einem anderen Konto an. Wenn Sie eines festlegen, werden Sie überall sonst abgemeldet."
