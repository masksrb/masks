de:
  manage:
    ldap:
      title: "LDAP"
      lede: "Ältere Dienste wie NAS-Geräte, Medienserver und Hypervisoren prüfen Passwörter und lesen Gruppen über LDAP. masks stellt ihnen die Akteure und Gruppen dieses Mandanten schreibgeschützt bereit."
      revoke_confirm: "%{label} widerrufen? Alles, was sich damit bindet, wird ab sofort abgelehnt."
      revoked: "%{label} ist widerrufen."
      serve:
        title: "Verzeichnis"
        help: "Solange dies aus ist, kann sich nichts an das Verzeichnis dieses Mandanten binden oder darin suchen."
        "on": "Diesen Mandanten über LDAP anbieten"
        updated: "Verzeichnis geändert."
      connect:
        title: "Einen Dienst verbinden"
        help: "Geben Sie dem Dienst diesen Basis-DN, einen Bind-DN und sein Geheimnis. Der Dienst sucht in ou=people und ou=groups und bindet sich dann als Akteur, um dessen Passwort zu prüfen."
        base_dn: "Basis-DN"
        address: "Adresse"
        port: "Port %{port}"
        ldaps: "Port %{port}, LDAPS"
        label: "Bezeichnung"
        issue: "Zugang ausstellen"
        shown_once: "Dieses Geheimnis wird nur einmal angezeigt. Kopieren Sie es jetzt."
        bind_dn: "Bind-DN"
        secret: "Geheimnis"
      credentials:
        title: "Zugänge"
        none: "Keine ausgestellt."
        never: "nie"
        used: "zuletzt gebunden %{used}"
        revoke: "Widerrufen"
      binds:
        title: "Bindungen mit Passwort"
        help: "LDAP kann keinen zweiten Faktor abfragen. Ein Akteur, der einen hat oder dessen Anmelderichtlinie einen verlangt, wird abgelehnt, außer hier ist ein Passwort allein erlaubt."
        password_only: "Ein Passwort allein über LDAP erlauben"
        updated: "Bindungen mit Passwort geändert."
