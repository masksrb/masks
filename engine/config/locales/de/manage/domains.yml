de:
  manage:
    domains:
      title: "Domains"
      help: "Beanspruchen Sie eine Domain, indem Sie einen TXT-Eintrag veröffentlichen. masks prüft ihn stündlich. Sobald sie nachgewiesen ist, können Personen, die dort eine Adresse eingeben, ohne Passwort direkt zu einem Anbieter gehen, und die Anmeldung kann unter einem Host darin angeboten werden, etwa login.example.com, sobald dessen DNS hierher zeigt und er ein Zertifikat hat. Jede Adresse ist ein eigener Issuer, und ein Passkey funktioniert nur unter der Adresse, unter der er erstellt wurde."
      claimed: "Veröffentlichen Sie den TXT-Eintrag unten und prüfen Sie dann %{domain}."
      proven: "%{domain} ist nachgewiesen."
      unanswered: "Bei %{name} gibt es noch keinen passenden TXT-Eintrag. Es kann eine Weile dauern, bis sich DNS-Änderungen verbreiten."
      routed_away: "Personen bei %{domain} werden jetzt zu ihrem Anbieter geleitet."
      routed_here: "Personen bei %{domain} melden sich jetzt hier an."
      served: "Die Anmeldung wird jetzt auch unter %{host} angeboten."
      unserved: "Die Anmeldung wird nicht mehr unter einer eigenen Domain angeboten."
      stop_confirm: "%{host} nicht mehr anbieten? Apps, die ihn als Issuer verwenden, funktionieren nicht mehr."
      release_confirm: "%{domain} freigeben? Personen mit einer Adresse dort melden sich wieder auf dem üblichen Weg an."
      released: "%{domain} ist freigegeben."
      here: "Hier anmelden"
      to: "An %{name} senden"
      missing: "Antwortet seit %{since} nicht mehr"
      unproven: "Nicht nachgewiesen"
      send: "Wo sich Personen bei %{domain} anmelden"
      check: "Prüfen"
      release: "%{domain} freigeben"
      record: "Veröffentlichen Sie diesen TXT-Eintrag:"
      new: "Zu beanspruchende Domain"
      add: "Beanspruchen"
      serve: "Anmeldung anbieten unter"
      save: "Anbieten"
      stop: "Beenden"
