        help: "Ein Konto, bei dem sich niemand anmeldet und das niemand über eine App nutzt, wird nach diesen Zeiträumen gesperrt und dann gelöscht. Vor jedem Schritt wird mindestens 30 Tage vorher per E-Mail gewarnt, und eine Anmeldung vor der Sperrung erhält das Konto. Ist „Sperren“ gesetzt, werden nur Konten gelöscht, die wegen Inaktivität gesperrt wurden. Steht „Sperren“ auf „Nie“, werden inaktive Konten direkt gelöscht. Der letzte Verwalter und Konten, die ein Anbieter über SCIM provisioniert, bleiben unberührt."
