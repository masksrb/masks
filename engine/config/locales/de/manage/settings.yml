        help: "Ein Akteur, als der sich niemand anmeldet und den niemand über einen Client nutzt, wird nach diesen Zeiträumen gesperrt und dann gelöscht. Vor jedem Schritt wird mindestens 30 Tage vorher per E-Mail gewarnt, und eine Anmeldung vor der Sperrung erhält den Akteur. Ist „Sperren“ gesetzt, werden nur Akteure gelöscht, die wegen Inaktivität gesperrt wurden. Steht „Sperren“ auf „Nie“, werden inaktive Akteure direkt gelöscht. Der letzte Verwalter und Akteure, die ein Verzeichnis über SCIM provisioniert, bleiben unberührt."
