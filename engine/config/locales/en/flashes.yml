en:
  devices:
    unknown: "There is no such device on this account."
    refused_agent: "This browser cannot sign in here."
    blocked: "This device is blocked."
    renamed: "Device renamed."
    shared: "Someone else has signed in on that device too, so it cannot be renamed here."
    signed_out: "That device has been signed out."

  organization_members:
    unknown: "You are not a member of that organization."
    not_a_member: "That person is not a member of this organization."
    invitee: "Someone invited"
    owners_only: "Only an owner of %{organization} can change its members."
    added: "%{identifier} is a member of %{organization}."
    assigned: "%{identifier} is %{role} now."
    removed: "%{identifier} is no longer a member of %{organization}."
    left: "You have left %{organization}. Anything signed in as a member of it stops working."
    accepted: "You are %{role} in %{organization} now."
    declined: "You declined %{organization}."
    confirm_first: "Confirm %{address} before joining %{organization}: send it a confirmation from your email settings on this page, then accept."
    elsewhere: "%{organization} invited %{address}, which is not the address on this account. Change your email to it and confirm it to join."
    slow_down: "That is a lot of people at once. Wait a minute and try again."
    resent: "The invitation to %{identifier} was sent again. It expires in %{age}."
    expired: "The invitation to %{organization} has expired. Ask an owner to send it again."

  apps:
    unknown: "There is no such app on this account."
    revoked: "Access for %{client} has been revoked. Anything it was holding stops working, and it has to ask again."

  connections:
    unknown: "There is no such connected account."
    disconnected: "%{provider} has been disconnected."
    linked: "%{provider} is connected. You can sign in with it from now on."
    unavailable: "That provider cannot be connected here."
    stale: "Sign in again before connecting another account. It has been a while since you did."
    expired: "That attempt to connect an account expired. Try again."
    failed: "%{provider} did not confirm who you are, so nothing was connected."
    taken: "That %{provider} account is already connected to somebody else here."

  delegations:
    unknown: "There is no such application using that account."
    stopped: "%{client} can no longer use your %{provider} account."

  passkeys:
    expired: "That enrolment expired. Try again."
    crowded: "You already have as many passkeys as this server keeps."
    unusable: "That passkey could not be added."
    unknown: "There is no such passkey on this account."
    last_way_in: "That passkey is the only way into this account. Add another before removing it."
    added: "Passkey added."
    removed: "Passkey removed."
    again: "Sign in again to change your passkeys. It has been a while since you did."

  code_factors:
    again: "Sign in again to change how sign-ins are confirmed. It has been a while since you did."
    unoffered: "This server does not offer that way of confirming a sign-in."
    unconfirmed: "Confirm that address before codes are sent to it."
    undeliverable: "This server cannot send those codes yet."
    enabled:
      email: "Sign-ins can now be confirmed with a code sent to your email."
      sms: "Sign-ins can now be confirmed with a code sent to your phone."
    disabled:
      email: "Email codes are off."
      sms: "Text message codes are off."

  sign_in_approvals:
    untrusted: "Only a device you trusted when signing in can approve a sign-in."
    no_match: "No sign-in on this account is waiting for that code."
    expired: "That sign-in stopped waiting. Ask for a new code on the other screen."
    too_many_attempts: "Too many attempts. Wait a few minutes and try again."
    approved: "Sign-in approved."
    denied: "Sign-in denied."

  passwords:
    too_many_attempts: "Too many attempts. Wait a few minutes and try again."
    short_password: "A password here needs at least %{minimum} characters."
    common_password: "That password is one of the most common. Choose another."
    breached_password: "That password has appeared in a data breach. Choose another."
    wrong_current: "That is not your current password."
    changed: "Your password has been changed, and every other session signed out."

  verifications:
    too_many_requests: "Too many requests. Wait a few minutes."
    no_address: "There is no address on this account to confirm."
    already_confirmed: "That address is already confirmed."
    no_mailer: "This server cannot send email. Ask a manager."
    sent: "A confirmation link is on its way to %{email}."

  avatars:
    updated: "Your photo has been updated."
    removed: "Your photo has been removed."

  handshakes:
    answered: "that connection request has already been answered"
    none_in_progress: "no connection request is in progress"
    not_permitted: "connecting an app is not something this account may do"
    already_connected: "%{resource} is already connected; a manager must reconnect it"
    beyond_account: "%{scopes} is more than this account holds"
    too_soon: "Nothing was registered. Read what it asks for, then approve once the countdown ends."

  account_export:
    again: "Sign in again to download your account. It has been a while since you did."
    throttled: "Your account was downloaded several times in the last hour. Try again later."
  account_deletion:
    again: "Sign in again to delete your account. It has been a while since you did."
    mismatch: "Type your account's name exactly as it is shown to delete it."
    manager: "You are the last person who manages this server, so your account cannot be deleted."
    provisioned: "Your organization manages this account, so only it can delete the account."
    deleted: "Your account was deleted."
