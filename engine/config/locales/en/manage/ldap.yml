en:
  manage:
    ldap:
      title: "LDAP"
      lede: "Older services such as NAS boxes, media servers, and hypervisors check passwords and read groups over LDAP. masks serves this tenant's actors and groups to them read-only."
      revoke_confirm: "Revoke %{label}? Anything binding with it is refused from now on."
      revoked: "%{label} is revoked."
      serve:
        title: "Directory"
        help: "While this is off, nothing can bind to or search this tenant's directory."
        "on": "Serve this tenant over LDAP"
        updated: "Directory changed."
      connect:
        title: "Connect a service"
        help: "Give the service this base DN, a bind DN, and its secret. The service searches ou=people and ou=groups, then binds as an actor to check their password."
        base_dn: "Base DN"
        address: "Address"
        port: "Port %{port}"
        ldaps: "Port %{port}, LDAPS"
        local_only: "Without a certificate, the directory answers only on this server's own machine, so no password crosses the network in the clear. Set MASKS_LDAP_CERT and MASKS_LDAP_KEY to serve LDAPS on every address, or MASKS_LDAP_PLAINTEXT=true on a private network you trust."
        label: "Label"
        issue: "Issue a credential"
        shown_once: "This secret is shown once. Copy it now."
        bind_dn: "Bind DN"
        secret: "Secret"
      credentials:
        title: "Credentials"
        none: "None issued."
        never: "never"
        used: "last bound %{used}"
        revoke: "Revoke"
      binds:
        title: "Password binds"
        help: "LDAP cannot ask for a second factor. An actor who has one, or whose sign-in policy requires one, is refused unless a password alone is allowed here."
        password_only: "Allow a password alone over LDAP"
        updated: "Password binds changed."
