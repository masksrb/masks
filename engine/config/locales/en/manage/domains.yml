en:
  manage:
    domains:
      title: "Domains"
      help: "Claim a domain by publishing a TXT record. masks checks it every hour. Once it is proven, people who type an address there can go straight to a provider without a password, and sign-in can be served from a host inside it, such as login.example.com, once that host's DNS points here and it has a certificate. Each address is its own issuer, and a passkey works only on the address it was made on."
      claimed: "Publish the TXT record below, then check %{domain}."
      proven: "%{domain} is proven."
      unanswered: "No matching TXT record at %{name} yet. DNS can take a while to spread."
      routed_away: "People at %{domain} go to their provider now."
      routed_here: "People at %{domain} sign in here now."
      served: "Sign-in is served from %{host} too."
      unserved: "Sign-in is no longer served from a custom domain."
      stop_confirm: "Stop serving %{host}? Apps that use it as their issuer stop working."
      release_confirm: "Release %{domain}? People with an address there sign in the usual way again."
      released: "%{domain} is released."
      here: "Sign in here"
      to: "Send to %{name}"
      missing: "Stopped answering %{since}"
      unproven: "Not proven"
      send: "Where people at %{domain} sign in"
      check: "Check"
      release: "Release %{domain}"
      record: "Publish this TXT record:"
      new: "Domain to claim"
      add: "Claim"
      serve: "Serve sign-in at"
      save: "Serve"
