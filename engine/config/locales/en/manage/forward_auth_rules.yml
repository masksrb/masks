en:
  manage:
    forward_auth_rules:
      title: "Rules"
      lede: "The first rule that covers a request decides it. A request no rule covers needs a signed-in person who may sign in."
      empty: "There are no rules. Every request needs a signed-in person who may sign in."
      paths: "Paths"
      paths_hint: "One per line. * covers one segment and ** covers any depth, so /admin/** covers /admin and everything under it. Empty covers every path."
      methods: "Methods"
      methods_hint: "GET, POST, and so on. Empty covers every method."
      networks: "Networks"
      networks_hint: "Addresses or ranges, such as 192.168.0.0/16. Empty covers every address."
      groups: "Groups"
      groups_hint: "Group keys, or roles as key:role. Empty covers everyone."
      outcome: "Outcome"
      outcomes:
        open: "Open to everyone, with no sign-in"
        one_factor: "A signed-in person, without a second factor"
        two_factor: "A signed-in person, with their second factor"
        token: "A signed-in person, or a script with an access token"
        deny: "Closed to everyone"
      rule: "Rule %{number}"
      add: "Add rule"
      remove: "Remove"
      up: "Move up"
      down: "Move down"
      save: "Save rules"
      saved: "Rules saved."
      trust: "A network rule trusts the address the proxy sends. Make sure the proxy sets X-Forwarded-For itself."
