en:
  actor_mailer:
    shared:
      fallback: "Or paste this into your browser:"
      sent_by: "Sent by %{tenant}'s sign-in service."
      sent_by_html: "This message was sent by %{tenant}&rsquo;s sign-in service."

    invitation:
      subject: "You have been invited to %{tenant}"
      invited_by: "%{nickname} invited you to %{tenant}."
      invited: "You have been invited to %{tenant}."
      nickname_html: "Your nickname is %{nickname}. Open the link to choose a password."
      nickname: "Your nickname is %{nickname}. Open the link to choose a password."
      action: "Choose a password"
      expiry: "Works once, expires in %{duration}. Nothing happens until somebody opens it."

    password_reset:
      subject: "Reset your %{tenant} password"
      opened_by: "%{nickname} started a password reset for your %{tenant} account."
      opened: "Somebody asked to reset the password for your %{tenant} account."
      action: "Reset your password"
      expiry: "Works once, expires in %{duration}. Setting a new password signs you out everywhere else. If this was not you, ignore it — nothing has changed."

    notification:
      subject: "%{said} — %{tenant}"
      action: "Review your account"
      by: "%{nickname} did this, not you."
      seen: "Recorded %{at}."
      wrong: "If this was not you, change your password and sign out everywhere."
      manage: "Choose which of these arrive"

      said:
        password:
          changed: "The password on your %{tenant} account was changed."
          reset_completed: "Your %{tenant} password was reset through a link sent to this address. Every other session was signed out."
        passkey:
          added: "A passkey was added to your %{tenant} account. It can now sign in without a password."
          removed: "A passkey was removed from your %{tenant} account."
        backup_codes:
          generated: "A fresh set of backup codes was generated for your %{tenant} account. The codes printed before this no longer work."
        backup_code:
          spent: "A backup code was used to sign in to your %{tenant} account. %{remaining} are left."
        authenticator:
          enabled: "An authenticator app was added to your %{tenant} account. Signing in now asks for its code."
          disabled: "The authenticator app on your %{tenant} account was removed. It is no longer asked for at sign-in."
        email_codes:
          enabled: "Signing in to your %{tenant} account can now be confirmed with a code sent to this address."
          disabled: "Signing in to your %{tenant} account can no longer be confirmed with a code sent to this address."
        text_codes:
          enabled: "Signing in to your %{tenant} account can now be confirmed with a code sent to your phone."
          disabled: "Signing in to your %{tenant} account can no longer be confirmed with a code sent to your phone."
        session:
          started: "Somebody signed in to your %{tenant} account on a device that had not been seen before."
          revoked: "A session on your %{tenant} account was ended for you."
        device:
          blocked: "A device was blocked from your %{tenant} account. It cannot sign in until somebody unblocks it."
        consent:
          granted: "%{client} was allowed into your %{tenant} account and can now read what you agreed to share."
        connection:
          linked: "%{provider} was connected to your %{tenant} account and can now be used to sign in."
          unlinked: "%{provider} was disconnected from your %{tenant} account."
        device_code:
          approved: "%{client} was signed in to your %{tenant} account from a device that showed you a code."
        actor:
          scopes_changed: "What your %{tenant} account is allowed to do was changed."

    confirmation_code:
      subject: "%{code} is your %{tenant} confirmation code"
      lede: "Enter this code where you are signing in to %{tenant}."
      expiry: "It works once and expires in %{duration}. If this was not you, ignore it."

    approval_requested:
      subject: "%{nickname} is waiting to be let in to %{tenant}"
      lede: "%{nickname} created an account at %{tenant}. It cannot sign in until a manager approves it."
      action: "Review the account"

    approved:
      subject: "Your %{tenant} account is ready"
      lede: "A manager approved your account at %{tenant}. You can sign in now."
      action: "Sign in"

    email_verification:
      subject: "Confirm your email address for %{tenant}"
      confirm_html: "Confirm this address for %{nickname} at %{tenant}."
      confirm: "Confirm this address for %{nickname} at %{tenant}."
      action: "Confirm this address"
      expiry: "Works once, expires in %{duration}. If this was not you, ignore it — nothing else changes."
