es:
  manage:
    domains:
      title: "Dominios"
      help: "Reclama un dominio publicando un registro TXT. masks lo comprueba cada hora. Una vez verificado, quien escribe una dirección de ese dominio puede ir directamente a un proveedor sin contraseña, y el inicio de sesión se puede servir desde un host dentro de él, como login.example.com, cuando su DNS apunte aquí y tenga un certificado. Cada dirección es su propio emisor, y una llave de acceso solo funciona en la dirección en la que se creó."
      claimed: "Publica el registro TXT de abajo y luego comprueba %{domain}."
      proven: "%{domain} está verificado."
      unanswered: "Todavía no hay ningún registro TXT coincidente en %{name}. El DNS puede tardar en propagarse."
      routed_away: "Los actores de %{domain} van ahora a su proveedor."
      routed_here: "Los actores de %{domain} inician sesión aquí ahora."
      served: "El inicio de sesión también se sirve desde %{host}."
      unserved: "El inicio de sesión ya no se sirve desde un dominio personalizado."
      stop_confirm: "¿Dejar de servir %{host}? Los clientes que lo usan como emisor dejan de funcionar."
      release_confirm: "¿Liberar %{domain}? Los actores con una dirección allí vuelven a iniciar sesión de la forma habitual."
      released: "%{domain} está liberado."
      here: "Iniciar sesión aquí"
      to: "Enviar a %{name}"
      missing: "Dejó de responder %{since}"
      unproven: "Sin verificar"
      send: "Dónde inician sesión los actores de %{domain}"
      check: "Comprobar"
      release: "Liberar %{domain}"
      record: "Publica este registro TXT:"
      new: "Dominio para reclamar"
