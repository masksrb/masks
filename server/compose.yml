name: masks

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./db/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  masks:
    profiles: ["image"]
    build:
      context: .
    image: masks:dev
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: masks
      POSTGRES_PASSWORD: masks
      POSTGRES_DATABASE: masks_image
      SECRET_KEY_BASE: dev_only_secret_key_base_not_for_real_deployments
      ENCRYPTION_PRIMARY_KEY: dev_only_primary_key_not_for_real_credentials
      ENCRYPTION_DETERMINISTIC_KEY: dev_only_deterministic_key_not_for_real_use
      ENCRYPTION_KEY_DERIVATION_SALT: dev_only_key_derivation_salt_not_for_real
      RAILS_ASSUME_SSL: "false"
      RAILS_FORCE_SSL: "false"
      SOLID_QUEUE_IN_PUMA: "true"
    ports:
      - "${MASKS_IMAGE_PORT:-5556}:80"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost/up > /dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

  test:
    profiles: [ "test" ]
    build:
      context: .
      target: test
    image: masks-test:dev
    command: ["bin/rails", "db:prepare", "test"]
    environment:
      RAILS_ENV: test
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: masks
      POSTGRES_PASSWORD: masks
      SECRET_KEY_BASE: dev_only_secret_key_base_not_for_real_deployments
      ENCRYPTION_PRIMARY_KEY: dev_only_primary_key_not_for_real_credentials
      ENCRYPTION_DETERMINISTIC_KEY: dev_only_deterministic_key_not_for_real_use
      ENCRYPTION_KEY_DERIVATION_SALT: dev_only_key_derivation_salt_not_for_real
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres:
