default: &default
  cleanup:
    class: Masks::Server::CleanupJob
    queue: maintenance
    schedule: every day at 4am

  authenticators:
    class: Masks::Server::RefreshAuthenticatorsJob
    queue: maintenance
    schedule: every day at 3am

  saml_metadata:
    class: Masks::Server::RefreshSamlMetadataJob
    queue: maintenance
    schedule: every day at 2am

  idle_accounts:
    class: Masks::Server::IdleAccountsJob
    queue: maintenance
    schedule: every day at 5am

  signing_keys:
    class: Masks::Server::RotateSigningKeysJob
    queue: maintenance
    schedule: every day at 1am

  domain_claims:
    class: Masks::Server::CheckDomainClaimsJob
    queue: maintenance
    schedule: every hour

  prune_queue:
    class: Masks::Server::PruneQueueJob
    queue: maintenance
    schedule: every day at 6am

  refresh_groups:
    class: Masks::Server::RefreshGroupsJob
    queue: maintenance
    schedule: every hour
  health:
    class: Masks::Server::HealthCheckJob
    queue: maintenance
    schedule: every 10 minutes

  release_check:
    class: Masks::Server::ReleaseCheckJob
    queue: maintenance
    schedule: every day at 7am

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
