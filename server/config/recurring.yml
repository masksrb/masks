default: &default
  cleanup:
    class: CleanupJob
    queue: maintenance
    schedule: every day at 4am

  authenticators:
    class: RefreshAuthenticatorsJob
    queue: maintenance
    schedule: every day at 3am

  saml_metadata:
    class: RefreshSamlMetadataJob
    queue: maintenance
    schedule: every day at 2am

development:
  <<: *default

test:
  <<: *default

production:
  <<: *default
