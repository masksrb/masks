en:
  account:
    index:
      none_yet: "Nothing yet."
      sign_out: "Sign out"
      title: "Your account"
      manage: "Manage this server"
      lede: "This is where you change how you sign in, see the devices you are signed in on, and check what has been happening to your account."

      signing_in:
        heading: "Signing in"

      email:
        heading: "Email address"
        state:
          none: "None"
          unconfirmed: "Not confirmed"
        none_set: "This account has no email address. Nothing can be sent to it, and you cannot reset your own password. Ask a manager to add one."
        body: "Password resets and confirmations go to %{email}."
        send_link: "Send confirmation link"

      password:
        heading: "Password"
        state: "Change it"
        current: "Your current password"
        new: "Your new password"
        hint: "At least %{minimum} characters. Changing it signs you out everywhere else."
        submit: "Change password"

      passkeys:
        heading: "Passkeys"
        state:
          none: "Not set up"
          set:
            one: "1 set up"
            other: "%{count} set up"
        explained: "Instead of typing a password, your device checks it is you the way it already unlocks. It counts as both factors at once, so there is no code to wait for."
        used: "last used %{age} ago"
        never_used: "never used"
        remove: "Remove"
        confirm_remove: "Remove this?"
        compromised: "The FIDO Alliance reports a problem with this model (%{report}). Replace it."
        name: "What is this device called?"
        name_placeholder: "My laptop"
        add: "Set this up"

      devices:
        heading: "Devices"
        lede: "Every phone, tablet and computer that has signed in to this account."
        none: "Nothing has signed in yet."
        state:
          here: "This device"
          signed_in: "Signed in"
          signed_out: "Signed out"
          blocked: "Blocked"
        seen: "Last seen %{age} ago."
        from: "Last used from %{address}."
        skips_code: "This device does not have to enter a code."
        sign_out: "Sign this device out"
        save_name: "Save name"

      apps:
        heading: "Apps and accounts"
        state:
          none: "None"

      applications:
        heading: "Apps you have let in"
        none_yet: "Nothing has asked yet. An app appears here once you sign in to it, with what you agreed it may see."
        revoke: "Revoke access"
        more:
          one: "and one more"
          other: "and %{count} more"
        confirm_revoke: "Revoke %{client}? Anything it is holding stops working, and it has to ask again the next time you sign in."

      connections:
        heading: "Connected accounts"
        lede: "An account somewhere else — a work account, say — that is linked to this one. It can be a way of signing in here."
        signs_you_in: "signs you in"
        link: "Connect %{provider}"
        disconnect: "Disconnect"
        confirm_disconnect: "Disconnect %{provider}? If you sign in with it, you will need another way in. Every application using it stops."
        delegated: "%{client} can use it while you are away"
        stop: "Stop"
        confirm_stop: "Stop %{client} using your %{provider} account? It has to ask you again."

      info:
        heading: "Details"

      picture:
        change: "Change your photo"
        remove: "Remove photo"
        confirm_remove: "Remove your photo?"

      notifications:
        heading: "Emails we send you"
        state:
          zero: "All of them"
          one: "One turned off"
          other: "%{count} turned off"
        lede: "Everything here is on until you turn it off. These arrive as they happen, and none of them can be replied to."
        silent: "Nothing is being sent, because these only go to a confirmed email address."
        submit: "Save"

      activity:
        heading: "Activity"
        entry: "Recent activity"
        lede: "What has happened to your account lately. Anything you do not recognise is worth changing your password over."
        ago: "%{age} ago"
        check_this: "worth a look"

      signed_out:
        title: "Your account"
        sign_in: "Sign in"
