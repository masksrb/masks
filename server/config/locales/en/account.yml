en:
  account:
    index:
      none_yet: "Nothing yet."
      sign_out: "Sign out"
      welcome: "Welcome, %{name}"
      manage: "Manage this server"
      lede: "This is where you change how you sign in, see the devices you are signed in on, and check what has been happening to your account."

      check:
        heading: "To-do"
        look: "Take a look"
        email:
          title: "Confirm your email"
          body: "Until you do, you cannot reset your own password."
        passkey:
          title: "Replace a passkey"
          body:
            one: "One of yours is a model with a reported security problem."
            other: "%{count} of yours are models with a reported security problem."
        device:
          title: "Look at a device"
          body:
            one: "One of the devices you have used is blocked."
            other: "%{count} of the devices you have used are blocked."

      signing_in:
        heading: "Signing in"

      email:
        heading: "Email address"
        state:
          none: "None"
          unconfirmed: "Not confirmed"
        none_set: "This account has no email address. Nothing can be sent to it, and you cannot reset your own password. Ask whoever runs this server to add one."
        body: "Password resets and confirmations go to %{email}."
        send_link: "Send verification"

      password:
        heading: "Password"
        state: "Change it"
        current: "Your current password"
        new: "Your new password"
        hint: "At least %{minimum} characters. Changing it signs you out everywhere else."
        submit: "Change password"

      passkeys:
        heading: "Fingerprint, face or PIN"
        state:
          none: "Not set up"
          set:
            one: "1 set up"
            other: "%{count} set up"
        explained: "Instead of typing a password, your device checks it is you the way it already unlocks. It counts as both steps at once, so there is no code to wait for."
        used: "last used %{age} ago"
        never_used: "never used"
        remove: "Remove"
        confirm_remove: "Remove this?"
        compromised: "The FIDO Alliance reports a problem with this model (%{report}). Replace it."
        name: "What is this device called?"
        name_placeholder: "My laptop"
        add: "Set this up"

      devices:
        heading: "Devices"
        lede: "Every phone, tablet and computer that has signed in to this account."
        none: "Nothing has signed in yet."
        state:
          here: "You are here"
          signed_in: "Signed in"
          signed_out: "Signed out"
          blocked: "Blocked"
        seen: "Last seen %{age} ago."
        from: "Last used from %{address}."
        skips_code: "This device does not have to enter a code."
        sign_out: "Sign this device out"
        save_name: "Save name"

      apps:
        heading: "Apps and accounts"
        state:
          none: "None"

      applications:
        heading: "Apps you have let in"
        none_yet: "Nothing has asked yet. An app appears here once you sign in to it, with what you agreed it may see."
        revoke: "Cut off"
        confirm_revoke: "Cut %{client} off? It has to ask again the next time you sign in, and anything it is holding stops working."

      connections:
        heading: "Accounts you sign in with"
        lede: "An account somewhere else — a work account, say — that is linked to this one. It can be a way of signing in here."
        signs_you_in: "signs you in"
        connect: "Connect %{provider}"
        disconnect: "Disconnect"
        confirm_disconnect: "Disconnect %{provider}? Anything relying on it stops working, and if you sign in with it you will need another way in."

      info:
        heading: "Details"

      picture:
        heading: "Picture"
        state:
          set: "A photo"
          none: "Drawn for you"
        lede: "All three are offered to any app that asks. The photo is yours to upload; the other two are drawn from your account and cannot be removed."
        styles:
          photo: "Photo"
          identicon: "Pattern"
          initials: "Initials"
        photo: "Choose a photo"
        hint: "Cropped to a square and re-encoded, so nothing of the original file survives."
        upload: "Upload"
        remove: "Remove photo"
        confirm_remove: "Remove your photo?"

      notifications:
        heading: "Emails we send you"
        state:
          zero: "All of them"
          one: "One turned off"
          other: "%{count} turned off"
        lede: "Everything here is on until you turn it off. These arrive as they happen, and none of them can be replied to."
        silent: "Nothing is being sent, because these only go to a confirmed email address."
        submit: "Save"

      activity:
        heading: "Activity"
        entry: "Recent activity"
        lede: "What has happened to your account lately. Anything you do not recognise is worth changing your password over."
        ago: "%{age} ago"
        check_this: "worth a look"

      signed_out:
        title: "Your account"
        sign_in: "Sign in"
