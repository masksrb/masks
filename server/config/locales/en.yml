# Files in the config/locales directory are used for internationalization and
# are automatically loaded by Rails. If you want to use locales other than
# English, add the necessary files in this directory.
#
# To use the locales, use `I18n.t`:
#
#     I18n.t "hello"
#
# In views, this is aliased to just `t`:
#
#     <%= t("hello") %>
#
# To use a different locale, set it with `I18n.locale`:
#
#     I18n.locale = :es
#
# This would use the information in config/locales/es.yml.
#
# To learn more about the API, please read the Rails Internationalization guide
# at https://guides.rubyonrails.org/i18n.html.
#
# Be aware that YAML interprets the following case-insensitive strings as
# booleans: `true`, `false`, `on`, `off`, `yes`, `no`. Therefore, these strings
# must be quoted to be interpreted as strings. For example:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
  authorize:
    error:
      heading: "This request cannot be completed"
      explanation: "The application that sent you here asked for something this server will not do, so you have not been signed in to it and nothing has been shared."
      contact: "Nothing is wrong with your account. The application has to fix this."
  logins:
    warnings:
      invalid-credentials: "That identifier and password do not match."
      invalid-code: "That code is not valid."
      missing-identifier: "Enter your username or email address."
      missing-first-factor: "That step expired. Start over and try again."
      too-many-attempts: "Too many sign-in attempts. Wait a few minutes and try again."
      too-many-attempts-for-account: "Too many sign-in attempts for that account."
      invalid-setup-token: "That setup token is not the one this server was started with."
      missing-nickname: "Choose a username for the owner account."
      short-password: "That password is too short."
      invalid-account: "That username cannot be used here."
      missing-email: "Enter an email address for the owner account."
      invitation-expired: "That invitation is no longer valid. Ask for another."
      reset-expired: "That reset link is no longer valid. Ask for another."
      no-mailer: "This server cannot send email, so it cannot reset a password. Ask an administrator."
    notices:
      reset-sent: "If that account exists and can receive email, a reset link is on its way."
