<!doctype html>
<html lang="en">
  <head>
    <title>There is no page at this address</title>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" href="/masks-public/favicon.svg" type="image/svg+xml">
    <style>
      :root {
        color-scheme: light dark;
        --ground: #ececed;
        --surface: #f7f7f8;
        --line: #d9d9dc;
        --ink: #18181b;
        --ink-soft: #5c5c63;
        --brass: #8a5a1c;
        --signal: #b3380f;
        --bad: #b0183f;
        --window-strength: 0.2;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --ground: #0b0b0c;
          --surface: #1c1c1f;
          --line: #2a2a2e;
          --ink: #ededef;
          --ink-soft: #9a9a9f;
          --brass: #c9a14a;
          --signal: #ff7a4a;
          --bad: #ff7396;
          --window-strength: 0.36;
        }
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        min-height: 100svh;
        margin: 0;
        display: flex;
        padding: 2.5rem 1.25rem 3rem;
        background: var(--ground);
        color: var(--ink);
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
      }

      body::before {
        --window-size: min(64rem, 150vw);
        content: "";
        position: fixed;
        top: calc(var(--window-size) * -0.42);
        right: calc(var(--window-size) * -0.2);
        width: var(--window-size);
        aspect-ratio: 1;
        pointer-events: none;
        background: url("/masks-public/icon.svg") center / contain no-repeat;
        filter: blur(56px) saturate(1.2);
        opacity: var(--window-strength);
      }

      main {
        position: relative;
        width: 100%;
        max-width: 21rem;
        margin: auto;
        display: flex;
        flex-direction: column;
        gap: 1.25rem;
      }

      .state {
        display: flex;
        align-items: center;
        gap: 0.5rem;
        font-size: 0.6875rem;
        font-weight: 700;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--brass);
      }

      .state::before {
        content: "";
        flex: none;
        width: 1.5rem;
        height: 2px;
        border-radius: 1px;
        background: currentColor;
      }

      .state-bad {
        color: var(--bad);
      }

      h1 {
        margin: 0;
        font-size: 1.125rem;
        font-weight: 500;
        letter-spacing: -0.012em;
        line-height: 1.4;
        text-wrap: balance;
      }

      p {
        margin: 0;
        font-size: 0.9375rem;
        line-height: 1.5;
        color: var(--ink-soft);
      }

      a {
        align-self: flex-start;
        padding: 0.6875rem 1rem;
        border-radius: 8px;
        border: 1px solid var(--line);
        background: var(--surface);
        color: var(--ink);
        font-size: 0.9375rem;
        font-weight: 500;
        text-decoration: none;
      }

      a:hover {
        border-color: color-mix(in oklab, var(--ink) 30%, var(--line));
      }

      a:focus-visible {
        outline: 2px solid var(--signal);
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <main>
      <span class="state">Not found</span>
      <h1>There is no page at this address.</h1>
      <p>Check the address for a typo. If a link brought you here, the page it pointed to has moved or was removed.</p>
      <a href="/">Go to your account</a>
    </main>
  </body>
</html>
