  name: String!
  namespaces: [Namespace!]!
  policyUri: String
  postLogoutRedirectUris: [String!]!
  protocol: String!
  redirectUris: [String!]!

  """
  Seconds from a sign-in until its refresh tokens stop, however often they are used. Null is 90 days.
