  """
  samlSloUrl: String
  secretExpiresAt: ISO8601DateTime
  sectorIdentifierUri: String
  signInPolicy: SignInPolicy
  subjectType: String!
  tokenEndpointAuthMethod: String!
  tokens(limit: Int): [Token!]!
