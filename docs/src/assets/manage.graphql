  """
  The types of authorization detail this client may ask for.
  """
  authorizationDetailsTypes: [String!]!
  backchannelLogoutSessionRequired: Boolean!
  backchannelLogoutUri: String
  clientId: ID!
  clientUri: String

  """
  Seconds a person's consent lasts before they are asked again. Null lasts until revoked.
  """
  consentLifetime: Int
  consentRequired: Boolean!
  consents(limit: Int): [Consent!]!
  createdAt: ISO8601DateTime!
  delegations: [Delegation!]!
  dpopBoundAccessTokens: Boolean!
  dynamic: Boolean!

  """
  The machines this app enrolled that are not archived.
  """
  enrolled: [Client!]!

  """
  The app that enrolled this client as one of its machines. Archiving that app archives this client.
  """
  enrolledBy: Client
  events(limit: Int): [Event!]!

  """
  The ordered rules forward auth follows for an app behind a proxy. Each has
  `paths`, `methods`, `networks`, and `groups` it covers, and an `outcome` of
  open, one_factor, two_factor, token, or deny. The first rule that covers a
